<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>관리자 계정 관리</title>
  <style>
    /* 탭 스타일 */
    .tab {
      display: flex;
      border-bottom: 2px solid #ccc;
      margin-bottom: 1em;
    }
    .tab button {
      background: none;
      border: none;
      padding: 10px 20px;
      cursor: pointer;
      font-weight: bold;
      border-bottom: 3px solid transparent;
      transition: border-color 0.3s;
    }
    .tab button.active {
      border-color: #007bff;
      color: #007bff;
    }
    /* 탭 콘텐츠 숨기기 */
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    /* 검색창 스타일 */
    .search-container {
      margin-bottom: 1em;
    }
    /* 버튼 스타일 */
    .btn-new {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 8px 15px;
      cursor: pointer;
      border-radius: 4px;
      margin-bottom: 1em;
    }
    /* 테이블 스타일 */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 1em;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px 12px;
      text-align: left;
    }
    th {
      background-color: #f0f0f0;
    }
  </style>
</head>
<body>
  <h1>관리자 계정 관리</h1>

  <!-- 탭 버튼들 -->
  <div class="tab">
    <button class="tablinks active" onclick="openTab(event, 'all')">전체</button>
    <button class="tablinks" onclick="openTab(event, 'used')">사용중 계정</button>
    <button class="tablinks" onclick="openTab(event, 'unused')">미사용 계정</button>
  </div>

  <!-- 검색창 -->
  <div class="search-container">
    <input type="text" id="searchInput" placeholder="검색어를 입력하세요." />
    <button onclick="searchAccount()">검색</button>
  </div>

  <!-- 신규 등록 버튼 -->
  <button class="btn-new" onclick="newRegistration()">신규 등록</button>

  <!-- 탭 콘텐츠 -->
   <div id="all" class="tab-content active">
    <h2>전체 계정 목록</h2>
    <table>
      <thead>
        <tr>
          <th>번호</th>
          <th>아이디</th>
          <th>이름</th>
          <th>이메일</th>
          <th>상태</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td>hong123</td>
          <td>홍길동</td>
          <td>hong@example.com</td>
          <td>활성</td>
        </tr>
        <tr>
          <td>2</td>
          <td>kim456</td>
          <td>김영희</td>
          <td>kim@example.com</td>
          <td>활성</td>
        </tr>
      </tbody>
    </table>
  </div>
  
  <div id="used" class="tab-content">
    <h2>사용중 계정 목록</h2>
    <table>
      <thead>
        <tr>
          <th>번호</th>
          <th>아이디</th>
          <th>이름</th>
          <th>이메일</th>
          <th>상태</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td>hong123</td>
          <td>홍길동</td>
          <td>hong@example.com</td>
          <td>활성</td>
        </tr>
        <tr>
          <td>2</td>
          <td>kim456</td>
          <td>김영희</td>
          <td>kim@example.com</td>
          <td>활성</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div id="unused" class="tab-content">
    <h2>미사용 계정 목록</h2>
    <table>
      <thead>
        <tr>
          <th>번호</th>
          <th>아이디</th>
          <th>이름</th>
          <th>이메일</th>
          <th>상태</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td>lee789</td>
          <td>이철수</td>
          <td>lee@example.com</td>
          <td>비활성</td>
        </tr>
        <tr>
          <td>2</td>
          <td>park012</td>
          <td>박민수</td>
          <td>park@example.com</td>
          <td>비활성</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    // 탭 열기 함수
    function openTab(evt, tabName) {
      const tabcontents = document.querySelectorAll('.tab-content');
      tabcontents.forEach(tc => tc.classList.remove('active'));

      const tablinks = document.querySelectorAll('.tablinks');
      tablinks.forEach(tl => tl.classList.remove('active'));

      document.getElementById(tabName).classList.add('active');
      evt.currentTarget.classList.add('active');
    }

    // 검색 함수 (임시)
    function searchAccount() {
      const keyword = document.getElementById('searchInput').value.trim();
      alert(`"${keyword}" 로 검색합니다! (실제 검색 로직 구현 필요)`);
    }

    // 신규 등록 함수 (임시)
    function newRegistration() {
      alert('신규 등록 창 열기 (모달 또는 새 페이지로 구현)');
    }
  </script>
</body>
</html>
