spring.application.name=logistics
server.port=${PORT:9000}

spring.main.allow-bean-definition-overriding=true

# DB 연결 (환경변수로 주입, 없으면 로컬 Oracle 사용)
spring.datasource.driver-class-name=${DB_DRIVER:oracle.jdbc.OracleDriver}
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/XE}
spring.datasource.username=${DB_USERNAME:dkgus}
spring.datasource.password=${DB_PASSWORD:dkgus0304}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.Oracle12cDialect}

# CORS
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
