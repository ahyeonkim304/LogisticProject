<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <title>상품 관리 - WMS</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-layout">
  <div th:replace="~{fragments/sidebar :: sidebar}"></div>
  <div class="main-content">
    <div class="content-body">
      <div id="toast-container" class="alert-container"></div>
      <header class="page-header">
        <h1 class="page-title">상품 관리</h1>
        <button class="btn btn-primary" onclick="openPanel('create')">+ 상품 등록</button>
      </header>

      <div class="card">
        <div class="filter-bar">
          <input id="search-input" class="form-control" placeholder="SKU 또는 상품명 검색" style="width:260px">
          <button class="btn btn-secondary btn-sm" onclick="load(0)">검색</button>
          <button class="btn btn-ghost btn-sm" onclick="resetFilter()">초기화</button>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr><th>SKU</th><th>상품명</th><th>카테고리</th><th>단위</th><th>안전재고</th><th>관리</th></tr>
            </thead>
            <tbody id="product-body"><tr><td colspan="6" class="text-center text-muted" style="padding:40px">로딩 중...</td></tr></tbody>
          </table>
          <div id="empty-area" style="display:none;flex:1"></div>
        </div>
        <div id="pagination"></div>
      </div>
    </div>
  </div>
</div>

<!-- 드로어 배경 -->
<div class="drawer-backdrop" id="drawer-backdrop" onclick="closePanel()"></div>

<!-- 등록 / 수정 드로어 -->
<div class="drawer" id="side-panel">
  <div class="drawer-header">
    <h3 id="panel-title">상품 등록</h3>
    <button class="drawer-close" onclick="closePanel()">✕</button>
  </div>
  <div class="drawer-body">
    <div class="form-group">
      <label class="form-label">SKU <span class="text-danger">*</span></label>
      <input id="p-sku" class="form-control" placeholder="예: PROD-001">
    </div>
    <div class="form-group">
      <label class="form-label">상품명 <span class="text-danger">*</span></label>
      <input id="p-name" class="form-control">
    </div>
    <div class="form-group">
      <label class="form-label">카테고리</label>
      <input id="p-category" class="form-control">
    </div>
    <div class="form-group">
      <label class="form-label">단위</label>
      <input id="p-unit" class="form-control" placeholder="예: EA, BOX">
    </div>
    <div class="form-group">
      <label class="form-label">설명</label>
      <textarea id="p-desc" class="form-control" rows="4"></textarea>
    </div>
  </div>
  <div class="drawer-footer">
    <button class="btn btn-secondary" onclick="closePanel()">취소</button>
    <button class="btn btn-primary" onclick="submitPanel()">저장</button>
  </div>
</div>

<script th:src="@{/js/app.js}"></script>
<script>
let currentPage = 0, currentSize = 20, editingId = null;

function resetFilter() {
  document.getElementById('search-input').value = '';
  load(0);
}

function openPanel(mode, r) {
  editingId = mode === 'edit' ? r.id : null;
  document.getElementById('panel-title').textContent = mode === 'edit' ? '상품 수정' : '상품 등록';
  const skuEl = document.getElementById('p-sku');
  if (mode === 'edit') {
    skuEl.value = r.sku; skuEl.disabled = true;
    document.getElementById('p-name').value     = r.name || '';
    document.getElementById('p-category').value = r.category || '';
    document.getElementById('p-unit').value     = r.unit || '';
    document.getElementById('p-desc').value     = r.description || '';
  } else {
    skuEl.value = ''; skuEl.disabled = false;
    ['p-name','p-category','p-unit','p-desc'].forEach(id => document.getElementById(id).value = '');
  }
  document.getElementById('side-panel').classList.add('open');
  document.getElementById('drawer-backdrop').classList.add('open');
}

function closePanel() {
  document.getElementById('side-panel').classList.remove('open');
  document.getElementById('drawer-backdrop').classList.remove('open');
  editingId = null;
}

async function submitPanel() {
  const body = {
    sku:         document.getElementById('p-sku').value.trim(),
    name:        document.getElementById('p-name').value.trim(),
    category:    document.getElementById('p-category').value.trim(),
    unit:        document.getElementById('p-unit').value.trim(),
    description: document.getElementById('p-desc').value.trim()
  };
  if (!body.sku || !body.name) { showToast('SKU와 상품명은 필수입니다.', 'error'); return; }
  try {
    if (editingId) { await apiFetch('PUT', `/products/${editingId}`, body); showToast('상품이 수정되었습니다.'); }
    else           { await apiFetch('POST', '/products', body); showToast('상품이 등록되었습니다.'); }
    closePanel(); load(currentPage);
  } catch (e) { showToast(e.message, 'error'); }
}

async function load(page = 0, size = currentSize) {
  currentPage = page; currentSize = size;
  const kw = document.getElementById('search-input').value.trim();
  try {
    const data = await apiFetch('GET', `/products?page=${page}&size=${size}${kw ? '&keyword=' + encodeURIComponent(kw) : ''}`);
    const rows = data.content ?? [];
    const tbody = document.getElementById('product-body');
    const emptyArea = document.getElementById('empty-area');
    if (!rows.length) {
      tbody.innerHTML = '';
      emptyArea.style.display = 'flex';
      emptyArea.innerHTML = renderEmptyState('등록된 상품이 없습니다', resetFilter);
    } else {
      emptyArea.style.display = 'none';
      tbody.innerHTML = rows.map(r => `<tr>
          <td><span class="font-mono" style="color:var(--accent)">${escHtml(r.sku)}</span></td>
          <td style="font-weight:500">${escHtml(r.name)}</td>
          <td>${escHtml(r.category) || '<span class="text-muted">-</span>'}</td>
          <td>${escHtml(r.unit) || '<span class="text-muted">-</span>'}</td>
          <td>${r.safetyStock != null ? r.safetyStock : '<span class="text-muted">-</span>'}</td>
          <td style="display:flex;gap:6px">
            <button class="btn btn-sm btn-secondary" onclick='openPanel("edit",${JSON.stringify(r)})'>수정</button>
            <button class="btn btn-sm btn-danger" onclick="del(${r.id})">삭제</button>
          </td>
        </tr>`).join('');
    }
    renderPagination(document.getElementById('pagination'), data, load, (s) => load(0, s));
  } catch (e) { showToast(e.message, 'error'); }
}

async function del(id) {
  if (!confirm('이 상품을 삭제하시겠습니까?')) return;
  try { await apiFetch('DELETE', `/products/${id}`); showToast('삭제되었습니다.'); load(currentPage); }
  catch (e) { showToast(e.message, 'error'); }
}

document.getElementById('search-input').addEventListener('keydown', e => { if (e.key === 'Enter') load(0); });
load();
</script>
</body>
</html>
