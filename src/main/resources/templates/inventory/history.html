<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <title>재고 이력 - WMS</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-layout">
  <div th:replace="~{fragments/sidebar :: sidebar}"></div>
  <div class="main-content">
    <div class="content-body">
      <div id="toast-container" class="alert-container"></div>
      <header class="page-header"><h1 class="page-title">재고 이력 조회</h1></header>

      <div class="card">
        <div class="card-body">
          <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center">
            <input id="filter-sku" class="form-control" placeholder="SKU" style="width:160px">
            <select id="filter-type" class="form-control" style="width:160px">
              <option value="">전체 유형</option>
              <option value="INBOUND">입고</option>
              <option value="OUTBOUND">출고</option>
              <option value="ADJUST">조정</option>
              <option value="MANUAL">직접 입력</option>
            </select>
            <input id="filter-from" class="form-control" type="date" style="width:150px">
            <span style="line-height:36px;color:var(--color-muted)">~</span>
            <input id="filter-to" class="form-control" type="date" style="width:150px">
            <button class="btn btn-secondary" onclick="load(0)">검색</button>
          </div>
          <table class="data-table">
            <thead>
              <tr><th>일시</th><th>SKU</th><th>상품명</th><th>유형</th><th>수량</th><th>로케이션</th><th>참조</th><th>메모</th></tr>
            </thead>
            <tbody id="hist-body"><tr><td colspan="8" class="text-center text-muted">로딩 중...</td></tr></tbody>
          </table>
          <div id="pagination"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script th:src="@{/js/app.js}"></script>
<script>
const TYPE_BADGE = { INBOUND:'badge-green', OUTBOUND:'badge-orange', ADJUST:'badge-yellow', MANUAL:'badge-blue' };
const TYPE_LABEL = { INBOUND:'입고', OUTBOUND:'출고', ADJUST:'조정', MANUAL:'직접 입력' };

async function load(page = 0) {
  const sku = document.getElementById('filter-sku').value.trim();
  const type = document.getElementById('filter-type').value;
  const from = document.getElementById('filter-from').value;
  const to = document.getElementById('filter-to').value;
  let params = `page=${page}&size=30`;
  if (sku) params += '&sku=' + encodeURIComponent(sku);
  if (type) params += '&type=' + type;
  if (from) params += '&from=' + from;
  if (to) params += '&to=' + to;
  try {
    const data = await apiFetch('GET', `/inventory/history?${params}`);
    const rows = data.content ?? [];
    document.getElementById('hist-body').innerHTML = !rows.length
      ? '<tr><td colspan="8" class="text-center text-muted">이력이 없습니다.</td></tr>'
      : rows.map(r => `<tr>
          <td>${fmtDate(r.createdAt)}</td>
          <td><code>${escHtml(r.productSku)}</code></td>
          <td>${escHtml(r.productName)}</td>
          <td><span class="badge ${TYPE_BADGE[r.type]||''}">${TYPE_LABEL[r.type]||escHtml(r.type)}</span></td>
          <td style="color:${r.quantity>0?'var(--color-success)':'var(--color-danger)'}">
            ${r.quantity > 0 ? '+' : ''}${r.quantity}
          </td>
          <td>${r.locationName ? escHtml(r.locationName) : '<span class="text-muted">-</span>'}</td>
          <td>${r.referenceId ? escHtml(r.referenceType||'')+' #'+r.referenceId : '<span class="text-muted">-</span>'}</td>
          <td>${r.memo ? escHtml(r.memo) : '<span class="text-muted">-</span>'}</td>
        </tr>`).join('');
    renderPagination(document.getElementById('pagination'), data, load);
  } catch (e) { showToast(e.message, 'error'); }
}

['filter-sku','filter-from','filter-to'].forEach(id =>
  document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') load(0); }));
load();
</script>
</body>
</html>
