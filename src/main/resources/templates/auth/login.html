<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <title>로그인 - WMS</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <span style="font-size:32px">📦</span>
      <h1>WMS</h1>
    </div>
    <div id="error-msg" class="alert alert-error" style="display:none"></div>
    <form id="login-form">
      <div class="form-group">
        <label class="form-label">아이디</label>
        <input id="username" class="form-control" type="text" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">비밀번호</label>
        <input id="password" class="form-control" type="password" required>
      </div>
      <button id="submit-btn" class="btn btn-primary" style="width:100%" type="submit">로그인</button>
    </form>
    <p style="text-align:center;margin-top:16px;font-size:13px">
      계정이 없으신가요? <a href="/register">회원가입</a>
    </p>
  </div>
</div>
<script>
  document.getElementById('login-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const errEl = document.getElementById('error-msg');
    btn.disabled = true; btn.textContent = '로그인 중...';
    errEl.style.display = 'none';
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value
        })
      });
      if (!res.ok) {
        const d = await res.json().catch(() => ({}));
        throw new Error(d.message || '로그인에 실패했습니다.');
      }
      window.location.href = '/';
    } catch (err) {
      errEl.textContent = err.message;
      errEl.style.display = 'block';
      btn.disabled = false; btn.textContent = '로그인';
    }
  });
</script>
</body>
</html>
