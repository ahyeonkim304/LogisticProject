<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <title>팔레트 출고 - WMS</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-layout">
  <div th:replace="~{fragments/sidebar :: sidebar}"></div>
  <div class="main-content">
    <div class="content-body">
      <div id="toast-container" class="alert-container"></div>
      <header class="page-header">
        <h1 class="page-title">팔레트 출고</h1>
        <button class="btn btn-primary" onclick="openPanel('create')">+ 팔레트 등록</button>
      </header>

      <div class="card">
        <div class="card-body">
          <table class="data-table">
            <thead><tr><th>팔레트 코드</th><th>로케이션</th><th>주문 수</th><th>상태</th><th>등록일</th><th>관리</th></tr></thead>
            <tbody id="pallet-body"><tr><td colspan="6" class="text-center text-muted">로딩 중...</td></tr></tbody>
          </table>
          <div id="pagination"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 주문 관리 모달 -->
<div id="order-modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeOrderModal()">
  <div class="modal-dialog">
    <div class="modal-header">
      <h3>주문 관리 — 팔레트 <span id="om-pallet-code"></span></h3>
      <button class="modal-close" onclick="closeOrderModal()">✕</button>
    </div>
    <div class="modal-body">
      <p style="font-size:13px;color:var(--color-muted);margin-bottom:12px">현재 팔레트에 담긴 주문</p>
      <div id="om-order-list" style="margin-bottom:16px;max-height:200px;overflow-y:auto;border:1px solid var(--color-border);border-radius:6px;padding:8px"></div>
      <div class="form-group">
        <label class="form-label">추가할 출고 ID</label>
        <div style="display:flex;gap:8px">
          <input id="om-outbound-id" class="form-control" type="number" placeholder="출고 ID">
          <button class="btn btn-primary" onclick="addOrder()">추가</button>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeOrderModal()">닫기</button>
      <button class="btn btn-success" onclick="startOutbound()">출고 시작</button>
    </div>
  </div>
</div>

<!-- 드로어 배경 -->
<div class="drawer-backdrop" id="drawer-backdrop" onclick="closePanel()"></div>

<!-- 등록 / 수정 드로어 -->
<div class="drawer" id="side-panel">
  <div class="drawer-header">
    <h3 id="panel-title">팔레트 등록</h3>
    <button class="drawer-close" onclick="closePanel()">✕</button>
  </div>
  <div class="drawer-body">
    <div class="form-group">
      <label class="form-label">팔레트 코드 <span class="text-danger">*</span></label>
      <input id="p-code" class="form-control" placeholder="예: PLT-001">
    </div>
    <div class="form-group">
      <label class="form-label">로케이션 ID</label>
      <input id="p-location" class="form-control" type="number" placeholder="선택사항">
    </div>
  </div>
  <div class="drawer-footer">
    <button class="btn btn-secondary" onclick="closePanel()">취소</button>
    <button class="btn btn-primary" onclick="submitPanel()">저장</button>
  </div>
</div>

<script th:src="@{/js/app.js}"></script>
<script>
let currentPage = 0, editingId = null, selectedPalletId = null;

function openPanel(mode, r) {
  editingId = mode === 'edit' ? r.id : null;
  document.getElementById('panel-title').textContent = mode === 'edit' ? '팔레트 수정' : '팔레트 등록';
  document.getElementById('p-code').value     = mode === 'edit' ? (r.code || '') : '';
  document.getElementById('p-location').value = mode === 'edit' ? (r.locationId || '') : '';
  document.getElementById('side-panel').classList.add('open');
  document.getElementById('drawer-backdrop').classList.add('open');
}

function closePanel() {
  document.getElementById('side-panel').classList.remove('open');
  document.getElementById('drawer-backdrop').classList.remove('open');
  editingId = null;
}

async function submitPanel() {
  const body = {
    code:       document.getElementById('p-code').value.trim(),
    locationId: document.getElementById('p-location').value ? parseInt(document.getElementById('p-location').value) : null
  };
  if (!body.code) { showToast('팔레트 코드는 필수입니다.', 'error'); return; }
  try {
    if (editingId) { await apiFetch('PUT', `/pallets/${editingId}`, body); showToast('수정되었습니다.'); }
    else           { await apiFetch('POST', '/pallets', body); showToast('등록되었습니다.'); }
    closePanel(); load(currentPage);
  } catch (e) { showToast(e.message, 'error'); }
}

async function load(page = 0) {
  currentPage = page;
  try {
    const data = await apiFetch('GET', `/pallets?page=${page}&size=20`);
    const rows = data.content ?? [];
    document.getElementById('pallet-body').innerHTML = !rows.length
      ? '<tr><td colspan="6" class="text-center text-muted">팔레트가 없습니다.</td></tr>'
      : rows.map(r => `<tr>
          <td><code>${escHtml(r.code)}</code></td>
          <td>${r.locationName ? escHtml(r.locationName) : '<span class="text-muted">미지정</span>'}</td>
          <td>${r.orderCount ?? 0}건</td>
          <td><span class="badge ${r.active ? 'badge-green' : 'badge-gray'}">${r.active ? '활성' : '비활성'}</span></td>
          <td>${fmtDate(r.createdAt)}</td>
          <td>
            <button class="btn btn-xs btn-primary" onclick="openOrders(${r.id},'${escHtml(r.code)}')">주문 관리</button>
            <button class="btn btn-xs btn-secondary" onclick='openPanel("edit",${JSON.stringify(r)})'>수정</button>
            <button class="btn btn-xs btn-danger" onclick="del(${r.id})">삭제</button>
          </td>
        </tr>`).join('');
    renderPagination(document.getElementById('pagination'), data, load);
  } catch (e) { showToast(e.message, 'error'); }
}

async function del(id) {
  if (!confirm('이 팔레트를 삭제하시겠습니까?')) return;
  try { await apiFetch('DELETE', `/pallets/${id}`); showToast('삭제되었습니다.'); load(currentPage); }
  catch (e) { showToast(e.message, 'error'); }
}

async function openOrders(id, code) {
  selectedPalletId = id;
  document.getElementById('om-pallet-code').textContent = code;
  document.getElementById('om-outbound-id').value = '';
  document.getElementById('order-modal').style.display = 'flex';
  await refreshOrderList();
}

async function refreshOrderList() {
  try {
    const pallet = await apiFetch('GET', `/pallets/${selectedPalletId}`);
    const orders = pallet.outbounds ?? [];
    document.getElementById('om-order-list').innerHTML = !orders.length
      ? '<div style="color:var(--color-muted);font-size:13px">담긴 주문 없음</div>'
      : orders.map(o => `<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--color-border)">
          <span style="font-size:13px"><code>#${o.id}</code> ${escHtml(o.orderNumber||'')} - ${escHtml(o.productSku||'')} (${o.quantity})</span>
          <button class="btn btn-xs btn-danger" onclick="removeOrder(${o.id})">제거</button>
        </div>`).join('');
  } catch (e) { showToast(e.message, 'error'); }
}

function closeOrderModal() { document.getElementById('order-modal').style.display = 'none'; }

async function addOrder() {
  const outboundId = document.getElementById('om-outbound-id').value;
  if (!outboundId) { showToast('출고 ID를 입력하세요.', 'error'); return; }
  try {
    await apiFetch('POST', `/pallets/${selectedPalletId}/orders`, { outboundId: parseInt(outboundId) });
    showToast('추가되었습니다.');
    document.getElementById('om-outbound-id').value = '';
    await refreshOrderList();
  } catch (e) { showToast(e.message, 'error'); }
}

async function removeOrder(outboundId) {
  try { await apiFetch('DELETE', `/pallets/${selectedPalletId}/orders/${outboundId}`); showToast('제거되었습니다.'); await refreshOrderList(); }
  catch (e) { showToast(e.message, 'error'); }
}

async function startOutbound() {
  if (!confirm('이 팔레트의 모든 주문을 출고 처리하시겠습니까?')) return;
  try { await apiFetch('POST', `/pallets/${selectedPalletId}/outbound`); showToast('출고가 시작되었습니다.'); closeOrderModal(); load(currentPage); }
  catch (e) { showToast(e.message, 'error'); }
}

load();
</script>
</body>
</html>
